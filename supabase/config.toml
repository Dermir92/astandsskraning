# D1 local only. Use scripts/d1-local.mjs; never link, push or deploy here.
project_id = "astandsskodun-docker-c1"
[api]
enabled = true
port = 56421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500
[db]
port = 56422
shadow_port = 56420
major_version = 17
[db.pooler]
enabled = false
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = false
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# CLI maps this to enabling the email provider; global auth.enable_signup=false
# still denies public registration. The integration suite verifies both paths.
enable_signup = true
enable_confirmations = false
[auth.rate_limit]
sign_in_sign_ups = 500
token_refresh = 500
[edge_runtime]
enabled = false
[analytics]
enabled = false
